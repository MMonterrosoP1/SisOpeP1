    <!-- Jaula Chroot -->
    <rect x="10" y="26" width="363" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="38" font-size="7.5" font-weight="700" fill="#334155">Jaula Chroot: /home/sftp/paciente_sftp (root:root 755)</text>
    <text x="16" y="50" font-size="7" fill="#64748b">Aislamiento total del árbol raíz de Linux — Imposible fuga por directory traversal (..)</text>
    <text x="16" y="61" font-size="7" fill="#2563eb">Subcarpeta de descarga: /constancias/ (Permisos de lectura)</text>

    <!-- Separación de cuentas -->
    <rect x="10" y="74" width="175" height="48" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="16" y="87" font-size="7.5" font-weight="700" fill="#166534">Usuario: backend_sftp</text>
    <text x="16" y="99" font-size="7" fill="#15803d">• Permiso: Lectura y Escritura (775)</text>
    <text x="16" y="111" font-size="7" fill="#047857">• Deposita constancias PDF de Next.js</text>

    <rect x="198" y="74" width="175" height="48" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="204" y="87" font-size="7.5" font-weight="700" fill="#b91c1c">Usuario: paciente_sftp</text>
    <text x="204" y="99" font-size="7" fill="#991b1b">• Permiso: Solo Lectura estricta (-R)</text>
    <text x="204" y="111" font-size="7" font-weight="700" fill="#dc2626">• Bloqueo total de subida (PUT/MKDIR)</text>
  </g>

  <!-- ==================== CLIENTES RECEPTOR / PRUEBAS ==================== -->
  <!-- Thunderbird -->
  <g transform="translate(640, 70)" filter="url(#shadow)">
    <rect width="200" height="110" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect width="200" height="24" rx="8" fill="#eff6ff"/>
