    <text x="12" y="44" font-size="7.5" font-weight="700" fill="#334155">Cuenta:</text>
    <text x="50" y="44" font-size="7.5" fill="#2563eb">paciente@grupo2.os</text>
    
    <text x="12" y="60" font-size="7.5" font-weight="700" fill="#334155">Protocolo:</text>
    <text x="60" y="60" font-size="7.5" fill="#475569">IMAP :143 en mail.grupo2.os</text>

    <rect x="10" y="70" width="180" height="30" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
    <text x="100" y="84" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">✔ Correo Recibido en Tiempo Real</text>
    <text x="100" y="94" font-size="7" fill="#166534" text-anchor="middle">Aviso de consulta y constancia disponible</text>
  </g>

  <!-- FileZilla / Cliente SFTP -->
  <g transform="translate(640, 200)" filter="url(#shadow)">
    <rect width="200" height="130" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="200" height="24" rx="8" fill="#ede9fe"/>
    <text x="100" y="16" font-size="8.5" font-weight="700" fill="#6b21a8" text-anchor="middle">📁 Cliente SFTP (FileZilla / Terminal)</text>

    <text x="12" y="42" font-size="7.5" font-weight="700" fill="#334155">Host:</text>
    <text x="45" y="42" font-size="7.5" fill="#7c3aed">sftp.grupo2.os:22</text>
    
    <rect x="10" y="52" width="180" height="30" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="16" y="65" font-size="7" font-weight="700" fill="#166534">✔ Descarga de PDF:</text>
    <text x="16" y="75" font-size="6.5" fill="#15803d">Descarga exitosa de /constancias/...</text>

    <rect x="10" y="88" width="180" height="32" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="16" y="101" font-size="7" font-weight="700" fill="#b91c1c">✖ Intento de Subida (Blindaje -R):</text>
    <text x="16" y="112" font-size="6.5" font-weight="700" fill="#dc2626">Upload failed: Permission denied</text>
  </g>

  <!-- Flechas CT 104 -> Clientes -->
  <path d="M 592 125 L 640 125" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 592 265 L 640 265" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>

</svg>
