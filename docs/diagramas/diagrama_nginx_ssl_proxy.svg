<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow-active" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2563eb" flood-opacity="0.2"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- ==================== CONTENEDOR 1: CLIENTE EN NAVEGADOR ==================== -->
  <rect x="20" y="20" width="190" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="20" width="190" height="28" rx="10" fill="#e2e8f0"/>
  <text x="115" y="39" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">DISPOSITIVO CLIENTE</text>

  <!-- Navegador Web -->
  <g transform="translate(35, 65)" filter="url(#shadow)">
    <rect width="160" height="255" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect width="160" height="26" rx="8" fill="#f1f5f9"/>
    <!-- Botones browser -->
    <circle cx="15" cy="13" r="3.5" fill="#ef4444"/>
    <circle cx="27" cy="13" r="3.5" fill="#f59e0b"/>
    <circle cx="39" cy="13" r="3.5" fill="#10b981"/>
    <rect x="52" y="6" width="98" height="14" rx="3" fill="#e2e8f0"/>
    <text x="101" y="16" font-size="7" fill="#64748b" text-anchor="middle">clinica.grupo2.os</text>

    <!-- Paso 1: Intento HTTP -->
    <rect x="10" y="36" width="140" height="52" rx="5" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
    <text x="16" y="52" font-size="8.5" font-weight="700" fill="#b45309">1. Petición Inicial Insegura</text>
    <text x="16" y="66" font-size="8" fill="#78350f">GET http://clinica.grupo2.os</text>
    <text x="16" y="78" font-size="7.5" fill="#d97706">Puerto 80 (Sin cifrar)</text>

    <!-- Paso 2: Redirección recibida -->
    <rect x="10" y="98" width="140" height="54" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="16" y="114" font-size="8.5" font-weight="700" fill="#15803d">2. Respuesta 301 Recibida</text>
    <text x="16" y="128" font-size="8" fill="#166534">Location: https://...</text>
    <text x="16" y="140" font-size="7.5" fill="#15803d">Redirección automática</text>

    <!-- Paso 3: Sesión Segura -->
    <rect x="10" y="162" width="140" height="80" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="16" y="178" font-size="8.5" font-weight="700" fill="#1e40af">🔒 3. Conexión Segura</text>
    <text x="16" y="193" font-size="8" fill="#1e3a8a">https://clinica.grupo2.os</text>
    <text x="16" y="206" font-size="7.5" fill="#2563eb">Puerto 443 | TLSv1.3</text>
    <text x="16" y="222" font-size="7" fill="#64748b">Cifrado de extremo a extremo</text>
    <text x="16" y="233" font-size="7" fill="#16a34a" font-weight="600">Candado de seguridad activo</text>
  </g>

  <!-- ==================== CONTENEDOR 2: CT 103 (NGINX PROXY & SSL) ==================== -->
  <rect x="250" y="20" width="340" height="320" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="250" y="20" width="340" height="28" rx="10" fill="#2563eb"/>
  <text x="420" y="39" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">🔒 CT 103: REVERSE PROXY NGINX &amp; SSL (REEYLI)</text>

  <!-- Subtítulo IP -->
  <text x="420" y="62" font-size="9" font-weight="700" fill="#1e40af" text-anchor="middle">IP Estática: 192.168.56.103 | Debian 12 LXC</text>

  <!-- Bloque 80 -->
  <g transform="translate(265, 75)" filter="url(#shadow)">
    <rect width="310" height="65" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="310" height="20" rx="6" fill="#fef3c7"/>
    <text x="15" y="14" font-size="8.5" font-weight="700" fill="#b45309">BLOQUE 1: server { listen 80; }</text>
    <text x="15" y="34" font-size="8" fill="#475569"><b>server_name:</b> clinica.grupo2.os portal.grupo2.os</text>
    <rect x="15" y="42" width="280" height="16" rx="3" fill="#fffbeb"/>
    <text x="20" y="53" font-size="8" font-weight="700" fill="#d97706">return 301 https://$host$request_uri;  (Forzado)</text>
  </g>

  <!-- Bloque 443 SSL -->
  <g transform="translate(265, 150)" filter="url(#shadow-active)">
    <rect width="310" height="175" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
    <rect width="310" height="22" rx="6" fill="#dbeafe"/>
    <text x="15" y="15" font-size="8.5" font-weight="700" fill="#1d4ed8">BLOQUE 2: server { listen 443 ssl http2; }</text>

    <!-- Certificados -->
    <rect x="12" y="28" width="286" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="42" font-size="7.5" font-weight="700" fill="#334155">Certificados TLS X.509 (OpenSSL CA Local):</text>
    <text x="20" y="54" font-size="7" fill="#64748b">ssl_certificate /etc/nginx/ssl/clinica.grupo2.os.crt;</text>
    <text x="20" y="64" font-size="7" fill="#64748b">ssl_certificate_key /etc/nginx/ssl/clinica.grupo2.os.key;</text>

    <!-- Reverse Proxy Pass -->
    <rect x="12" y="76" width="286" height="88" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="20" y="90" font-size="8" font-weight="700" fill="#1e40af">Proxy Inverso &amp; Inyección de Cabeceras Seguras:</text>
    <text x="20" y="104" font-size="7.5" font-weight="700" fill="#2563eb">proxy_pass http://192.168.56.102:3000;</text>
    <text x="20" y="117" font-size="7" fill="#475569">proxy_set_header Host $host;</text>
    <text x="20" y="128" font-size="7" fill="#475569">proxy_set_header X-Real-IP $remote_addr;</text>
    <text x="20" y="139" font-size="7" fill="#475569">proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;</text>
    <text x="20" y="150" font-size="7.5" font-weight="700" fill="#15803d">proxy_set_header X-Forwarded-Proto https;</text>
  </g>

  <!-- ==================== CONTENEDOR 3: CT 102 (NEXT.JS BACKEND) ==================== -->
  <rect x="630" y="20" width="210" height="320" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <rect x="630" y="20" width="210" height="28" rx="10" fill="#e2e8f0"/>
  <text x="735" y="39" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">⚙️ CT 102: NEXT.JS APP</text>

  <text x="735" y="62" font-size="8.5" font-weight="700" fill="#475569" text-anchor="middle">IP: 192.168.56.102</text>

  <g transform="translate(645, 75)" filter="url(#shadow)">
    <rect width="180" height="250" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="180" height="24" rx="8" fill="#f1f5f9"/>
    <text x="90" y="16" font-size="8.5" font-weight="700" fill="#334155" text-anchor="middle">Servidor de Aplicación</text>

    <rect x="10" y="35" width="160" height="42" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="18" y="50" font-size="8" font-weight="700" fill="#166534">PM2 Daemon: clinica</text>
    <text x="18" y="64" font-size="7.5" fill="#15803d">Puerto Local: :3000 (HTTP)</text>

    <rect x="10" y="85" width="160" height="75" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="18" y="100" font-size="8" font-weight="700" fill="#334155">Aislamiento de Backend:</text>
    <text x="18" y="114" font-size="7.5" fill="#64748b">• No expone puerto 3000 al exterior</text>
    <text x="18" y="128" font-size="7.5" fill="#64748b">• Solo recibe tráfico de CT 103</text>
    <text x="18" y="142" font-size="7.5" fill="#64748b">• Confía en X-Forwarded-Proto</text>
    <text x="18" y="154" font-size="7" fill="#2563eb">Better Auth URL = https://...</text>

    <rect x="10" y="170" width="160" height="65" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="90" y="185" font-size="8" font-weight="700" fill="#1e40af" text-anchor="middle">Salidas de Backend:</text>
    <text x="18" y="200" font-size="7.5" fill="#1e3a8a">➜ MariaDB SQL (:3306 en CT 105)</text>
    <text x="18" y="213" font-size="7.5" fill="#1e3a8a">➜ Redis NoSQL (:6379 en CT 103)</text>
    <text x="18" y="226" font-size="7.5" fill="#1e3a8a">➜ Postfix SMTP (:25 en CT 104)</text>
  </g>

  <!-- FLECHAS DE INTERCONEXIÓN -->
  <!-- Flecha 1: HTTP 80 Cliente -> CT 103 -->
  <path d="M 195 125 L 265 110" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>
  
  <!-- Flecha 2: Redirección 301 CT 103 -> Cliente -->
  <path d="M 265 125 L 195 170" stroke="#16a34a" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-green)"/>
  
  <!-- Flecha 3: HTTPS 443 Cliente -> CT 103 -->
  <path d="M 195 240 L 265 240" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  
  <!-- Flecha 4: proxy_pass CT 103 -> CT 102 -->
  <path d="M 575 240 L 630 240" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <rect x="580" y="224" width="45" height="14" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="0.8"/>
  <text x="602" y="234" font-size="6.5" font-weight="700" fill="#2563eb" text-anchor="middle">:3000</text>

</svg>
