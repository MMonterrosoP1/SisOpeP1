<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Filtro sombra suave -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow-active" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2563eb" flood-opacity="0.2"/>
    </filter>
    <!-- Marcador de flecha -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- ==================== CONTENEDOR 1: CLIENTES ==================== -->
  <rect x="20" y="20" width="170" height="340" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="105" y="42" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="0.5">CLIENTES EN EL AULA</text>

  <!-- Caja Cliente / Catedrático -->
  <g transform="translate(35, 75)" filter="url(#shadow)">
    <rect width="140" height="90" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect width="140" height="24" rx="8" fill="#f1f5f9"/>
    <text x="70" y="16" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">Dispositivo Cliente</text>
    <text x="70" y="45" font-size="18" text-anchor="middle">👨‍🏫 📱</text>
    <text x="70" y="66" font-size="9.5" fill="#475569" text-anchor="middle">Laptop Catedrático</text>
    <text x="70" y="79" font-size="8.5" fill="#64748b" text-anchor="middle">o Celulares en el Aula</text>
  </g>

  <!-- Concesión recibida -->
  <g transform="translate(35, 190)">
    <rect width="140" height="150" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="70" y="20" font-size="9" font-weight="700" fill="#1e40af" text-anchor="middle">ARRENDAMIENTO DHCP</text>
    <path d="M 15 28 L 125 28" stroke="#bfdbfe" stroke-width="1"/>
    <text x="12" y="45" font-size="8.5" fill="#1e3a8a"><b>IP:</b> 192.168.56.200-250</text>
    <text x="12" y="65" font-size="8.5" fill="#1e3a8a"><b>Mask:</b> 255.255.255.0</text>
    <text x="12" y="85" font-size="8.5" fill="#1e3a8a"><b>GW:</b> 192.168.56.1 (OPN)</text>
    <text x="12" y="105" font-size="8.5" fill="#1e3a8a"><b>DNS:</b> 192.168.56.101</text>
    <rect x="10" y="118" width="120" height="22" rx="4" fill="#dbeafe"/>
    <text x="70" y="132" font-size="8" font-weight="700" fill="#1d4ed8" text-anchor="middle">SSID: Grupo2_Clinica</text>
  </g>

  <!-- Línea Wi-Fi (Cliente -> AP) -->
  <path d="M 175 120 L 230 120" stroke="#2563eb" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-blue)"/>
  <text x="202" y="112" font-size="8" font-weight="700" fill="#2563eb" text-anchor="middle">Wi-Fi</text>

  <!-- ==================== HARDWARE FÍSICO (AP + POE + SWITCH) ==================== -->
  <!-- AP Ubiquiti -->
  <g transform="translate(235, 75)" filter="url(#shadow)">
    <rect width="120" height="90" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="120" height="24" rx="8" fill="#e0f2fe"/>
    <text x="60" y="16" font-size="9.5" font-weight="700" fill="#0369a1" text-anchor="middle">📡 AP UniFi nanoHD</text>
    <text x="60" y="48" font-size="9" font-weight="600" fill="#0f172a" text-anchor="middle">Ubiquiti 802.11ac</text>
    <text x="60" y="64" font-size="8" fill="#64748b" text-anchor="middle">Wi-Fi Corporativo</text>
    <text x="60" y="78" font-size="7.5" fill="#0284c7" text-anchor="middle">SSID: Grupo2_Clinica</text>
  </g>

  <!-- Línea PoE (AP -> Inyector) -->
  <path d="M 295 165 L 295 200" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="315" y="185" font-size="7.5" font-weight="700" fill="#0284c7">PoE</text>

  <!-- Inyector PoE -->
  <g transform="translate(245, 205)" filter="url(#shadow)">
    <rect width="100" height="42" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
    <text x="50" y="17" font-size="8.5" font-weight="700" fill="#334155" text-anchor="middle">⚡ Inyector PoE</text>
    <text x="50" y="32" font-size="7.5" fill="#64748b" text-anchor="middle">Puerto PoE ↔ LAN</text>
  </g>

  <!-- Línea LAN (Inyector -> Switch) -->
  <path d="M 295 247 L 295 285" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="318" y="270" font-size="7.5" font-weight="600" fill="#475569">Cable 1</text>

  <!-- Mini Switch Gigabit -->
  <g transform="translate(225, 290)" filter="url(#shadow)">
    <rect width="140" height="65" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
    <text x="70" y="22" font-size="9.5" font-weight="700" fill="#38bdf8" text-anchor="middle">🔌 Mini-Switch GbE</text>
    <text x="70" y="38" font-size="8" fill="#94a3b8" text-anchor="middle">5 Puertos Gigabit 1 Gbps</text>
    <!-- LEDs de puertos -->
    <circle cx="40" cy="52" r="3.5" fill="#22c55e"/>
    <circle cx="55" cy="52" r="3.5" fill="#22c55e"/>
    <circle cx="70" cy="52" r="3.5" fill="#22c55e"/>
    <circle cx="85" cy="52" r="3.5" fill="#475569"/>
    <circle cx="100" cy="52" r="3.5" fill="#475569"/>
  </g>

  <!-- ==================== LAPTOP WILSON (PERÍMETRO) ==================== -->
  <rect x="395" y="20" width="215" height="340" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <rect x="395" y="20" width="215" height="30" rx="10" fill="#ccfbf1"/>
  <text x="502" y="40" font-size="10.5" font-weight="700" fill="#0f766e" text-anchor="middle">💻 LAPTOP DE WILSON (PERÍMETRO)</text>

  <!-- OPNsense Box -->
  <g transform="translate(410, 60)" filter="url(#shadow)">
    <rect width="185" height="150" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
    <rect width="185" height="26" rx="8" fill="#0f766e"/>
    <text x="92" y="17" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">🛡️ OPNsense Router &amp; FW</text>
    
    <text x="12" y="44" font-size="8.5" font-weight="700" fill="#0f766e">IP LAN:</text>
    <text x="55" y="44" font-size="8.5" fill="#334155">192.168.56.1 /24</text>
    
    <text x="12" y="62" font-size="8.5" font-weight="700" fill="#0f766e">Gateway:</text>
    <text x="65" y="62" font-size="8.5" fill="#334155">Puerta de Enlace LAN</text>
    
    <rect x="10" y="73" width="165" height="32" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="92" y="86" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle">Servidor DHCPv4 (Puntos Extra)</text>
    <text x="92" y="98" font-size="7.5" fill="#166534" text-anchor="middle">Pool: .200-.250 | DNS: .101</text>
    
    <rect x="10" y="110" width="165" height="30" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="92" y="123" font-size="8" font-weight="700" fill="#b91c1c" text-anchor="middle">Firewall Blacklist (Puntos Extra)</text>
    <text x="92" y="134" font-size="7.5" fill="#991b1b" text-anchor="middle">Bloqueo de dominios no autorizados</text>
  </g>

  <!-- Salida WAN OPNsense -->
  <g transform="translate(410, 225)" filter="url(#shadow)">
    <rect width="185" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="92" y="18" font-size="8.5" font-weight="700" fill="#334155" text-anchor="middle">🌐 Salida WAN a Internet</text>
    <text x="92" y="32" font-size="7.5" fill="#64748b" text-anchor="middle">Modo Puente Wi-Fi (Datos Celular)</text>
  </g>

  <rect x="410" y="280" width="185" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="502" y="298" font-size="8" font-weight="700" fill="#475569" text-anchor="middle">Enlace Físico RJ-45:</text>
  <text x="502" y="312" font-size="7.5" fill="#64748b" text-anchor="middle">Adaptador Ethernet en Modo Puente</text>
  <text x="502" y="326" font-size="7.5" fill="#0f766e" font-weight="600" text-anchor="middle">Conectado a Puerto 3 del Switch</text>

  <!-- Línea Switch -> Laptop Wilson -->
  <path d="M 365 315 L 410 315" stroke="#0d9488" stroke-width="2" stroke-dasharray="2 2" marker-end="url(#arrow)"/>
  <text x="388" y="308" font-size="7.5" font-weight="700" fill="#0d9488" text-anchor="middle">Cable 2</text>

  <!-- ==================== LAPTOP MARVIN (PROXMOX & SERVIDORES) ==================== -->
  <rect x="630" y="20" width="215" height="340" rx="10" fill="#f8fafc" stroke="#3b82f6" stroke-width="2"/>
  <rect x="630" y="20" width="215" height="30" rx="10" fill="#dbeafe"/>
  <text x="737" y="40" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">🏢 LAPTOP MARVIN (PROXMOX VE 8)</text>

  <!-- Host Proxmox -->
  <text x="737" y="65" font-size="8.5" font-weight="700" fill="#334155" text-anchor="middle">Hipervisor Debian 12 (192.168.56.100)</text>
  <text x="737" y="77" font-size="7.5" fill="#64748b" text-anchor="middle">Switch Virtual: vmbr0 (192.168.56.0/24)</text>

  <!-- CT 101 - Wilson Highlighted -->
  <g transform="translate(640, 85)" filter="url(#shadow-active)">
    <rect width="195" height="52" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect width="195" height="18" rx="6" fill="#2563eb"/>
    <text x="97" y="13" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">🌐 CT 101: BIND9 DNS (.os) [Wilson]</text>
    <text x="10" y="32" font-size="8" font-weight="700" fill="#1e40af">IP: 192.168.56.101</text>
    <text x="10" y="44" font-size="7.5" fill="#3b82f6">Subdominios: clinica, mail, sftp, db</text>
  </g>

  <!-- Otros CTs -->
  <g transform="translate(640, 143)">
    <rect width="195" height="36" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="10" y="15" font-size="8" font-weight="700" fill="#334155">📦 CT 102: Next.js + React Fullstack</text>
    <text x="10" y="28" font-size="7.5" fill="#64748b">IP: 192.168.56.102:3000 (PM2 Daemon)</text>
  </g>

  <g transform="translate(640, 185)">
    <rect width="195" height="36" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="10" y="15" font-size="8" font-weight="700" fill="#334155">🔒 CT 103: Nginx SSL &amp; Redis NoSQL</text>
    <text x="10" y="28" font-size="7.5" fill="#64748b">IP: 192.168.56.103:443 (Reverse Proxy)</text>
  </g>

  <g transform="translate(640, 227)">
    <rect width="195" height="36" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="10" y="15" font-size="8" font-weight="700" fill="#334155">📧 CT 104: Postfix/Dovecot &amp; SFTP</text>
    <text x="10" y="28" font-size="7.5" fill="#64748b">IP: 192.168.56.104 (SMTP 25 / IMAP 143)</text>
  </g>

  <g transform="translate(640, 269)">
    <rect width="195" height="36" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="10" y="15" font-size="8" font-weight="700" fill="#334155">🗄️ CT 105: MariaDB SQL (Aislado)</text>
    <text x="10" y="28" font-size="7.5" fill="#64748b">IP: 192.168.56.105:3306 (iptables)</text>
  </g>

  <!-- Enlace Switch -> Proxmox -->
  <path d="M 295 355 L 295 370 L 680 370 L 680 345 L 680 320" stroke="#3b82f6" stroke-width="2" stroke-dasharray="2 2" fill="none"/>
  <rect x="440" y="360" width="100" height="16" rx="3" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
  <text x="490" y="372" font-size="7.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Cable 3: Realtek GbE</text>

</svg>
